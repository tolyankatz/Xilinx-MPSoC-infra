# Logstash Configuration for ZCU102 Test Framework
#
# This configuration defines the log processing pipeline for ZCU102 test execution
# data. It handles multiple input sources, performs log parsing and enrichment,
# and outputs structured data to Elasticsearch.
#
# Pipeline stages:
# 1. Input: Receives logs from multiple sources
# 2. Filter: Parses and enriches log data  
# 3. Output: Sends processed data to Elasticsearch

input {
  # TCP input for direct log shipping from test framework
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp_input", "zcu102_tests"]
  }
  
  # Beats input for Filebeat log shipping
  beats {
    port => 5044
    tags => ["beats_input"]
  }
  
  # File input for local log files (development/debugging)
  file {
    path => "/test_logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"  # Always read from beginning
    tags => ["file_input", "zcu102_tests"]
    codec => multiline {
      pattern => "^\d{4}-\d{2}-\d{2}"  # Lines starting with timestamp
      negate => true
      what => "previous"
    }
  }
}

filter {
  # Parse timestamp from log messages
  if [message] {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} - %{DATA:logger_name} - %{WORD:log_level} - %{GREEDYDATA:log_message}" 
      }
      tag_on_failure => ["_grokparsefailure"]
    }
    
    # Convert timestamp
    if [log_timestamp] {
      date {
        match => [ "log_timestamp", "ISO8601" ]
        target => "@timestamp"
      }
    }
  }
  
  # Process ZCU102 test-specific logs
  if "zcu102_tests" in [tags] {
    # Extract test information from structured logs
    if [test_name] {
      mutate {
        add_field => { "test_framework" => "zcu102_bsp_validation" }
        add_field => { "test_category" => "hardware_validation" }
      }
    }
    
    # Parse boot sequence logs
    if [test_type] == "boot" {
      grok {
        match => { 
          "log_message" => "Boot stage transition: %{WORD:boot_stage}" 
        }
        tag_on_failure => ["_boot_parse_failure"]
      }
      
      if [boot_stage] {
        mutate {
          add_field => { "boot_stage_detected" => "%{boot_stage}" }
        }
      }
    }
    
    # Parse UART test logs
    if [test_type] == "uart" {
      grok {
        match => { 
          "log_message" => "UART (?<uart_operation>test|command) %{WORD:uart_status}: %{GREEDYDATA:uart_details}" 
        }
        tag_on_failure => ["_uart_parse_failure"]
      }
    }
    
    # Parse Ethernet test logs  
    if [test_type] == "ethernet" {
      grok {
        match => { 
          "log_message" => "Ethernet (?<ethernet_test>connectivity|performance|stability) test %{WORD:ethernet_status}: %{GREEDYDATA:ethernet_details}" 
        }
        tag_on_failure => ["_ethernet_parse_failure"]
      }
      
      # Extract performance metrics
      if [ethernet_details] {
        grok {
          match => { 
            "ethernet_details" => "TCP=%{NUMBER:tcp_throughput_mbps:float}Mbps.*UDP=%{NUMBER:udp_throughput_mbps:float}Mbps" 
          }
          tag_on_failure => ["_ethernet_metrics_parse_failure"]
        }
      }
    }
    
    # Parse hardware control logs
    if [log_message] =~ /power|jtag|hardware/ {
      mutate {
        add_field => { "hardware_operation" => "true" }
      }
      
      grok {
        match => { 
          "log_message" => "(?<hardware_device>Power|JTAG) (?<hardware_action>\w+) (?<hardware_status>successful|failed): %{GREEDYDATA:hardware_details}" 
        }
        tag_on_failure => ["_hardware_parse_failure"]
      }
    }
  }
  
  # Parse Jenkins build information from Filebeat
  if "beats" in [tags] and [fields][jenkins_job] {
    mutate {
      add_field => { 
        "jenkins_job" => "%{[fields][jenkins_job]}"
        "jenkins_build" => "%{[fields][jenkins_build]}"
        "build_source" => "jenkins"
      }
    }
  }
  
  # Enrich logs with environment information
  mutate {
    add_field => { 
      "processed_timestamp" => "%{@timestamp}"
      "logstash_host" => "%{host}"
    }
  }
  
  # Convert numeric fields
  if [duration_seconds] {
    mutate {
      convert => { "duration_seconds" => "float" }
    }
  }
  
  if [response_time_ms] {
    mutate {
      convert => { "response_time_ms" => "float" }
    }
  }
  
  # Clean up temporary fields
  mutate {
    remove_field => [ "log_timestamp" ]
  }
  
  # Add GeoIP information if source IP is present
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # Fingerprint for deduplication
  fingerprint {
    source => ["message", "test_name", "test_type", "@timestamp"]
    target => "[@metadata][fingerprint]"
    method => "MURMUR3"
  }
}

output {
  # Output to Elasticsearch with dynamic index naming
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    
    # Dynamic index based on log type and date
    index => "zcu102-%{test_type:system}-%{+YYYY.MM.dd}"
    
    # Use fingerprint for document ID to prevent duplicates
    document_id => "%{[@metadata][fingerprint]}"
    
    # Template for index settings
    template_name => "zcu102_logs"
    template_pattern => "zcu102-*"
    template => {
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
        "index" => {
          "refresh_interval" => "5s"
        }
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "test_name" => { "type" => "keyword" }
          "test_type" => { "type" => "keyword" }
          "board_type" => { "type" => "keyword" }
          "build_version" => { "type" => "keyword" }
          "log_level" => { "type" => "keyword" }
          "log_message" => { 
            "type" => "text"
            "analyzer" => "standard"
          }
          "duration_seconds" => { "type" => "float" }
          "tcp_throughput_mbps" => { "type" => "float" }
          "udp_throughput_mbps" => { "type" => "float" }
          "boot_stage" => { "type" => "keyword" }
          "hardware_device" => { "type" => "keyword" }
          "hardware_action" => { "type" => "keyword" }
          "hardware_status" => { "type" => "keyword" }
        }
      }
    }
  }
  
  # Debug output for development (comment out in production)
  # stdout {
  #   codec => rubydebug {
  #     metadata => true
  #   }
  # }
  
  # Output metrics to separate index for dashboard creation
  if [test_type] and [duration_seconds] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "zcu102-metrics-%{+YYYY.MM}"
      document_id => "%{test_name}-%{[@metadata][fingerprint]}"
    }
  }
  
  # Output errors to separate index for monitoring
  if "_grokparsefailure" in [tags] or [log_level] == "ERROR" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "zcu102-errors-%{+YYYY.MM.dd}"
    }
  }
}
