# ===================================================================
# Deployment Manifest for ZCU102 BSP Validation
# ===================================================================
# This file is the single source of truth for a specific test run.
# It is generated by the CI/CD pipeline and consumed by the Test Host.
# -------------------------------------------------------------------

manifest_version: 1.0

# --- Target and Build Information (for Traceability) ---
target_board: "ZCU102"
build_info:
  # Unique ID for the build from the CI server (e.g., Jenkins build number)
  build_id: "bsp-main-137"
  # The exact Git commit hash this build was created from
  commit_hash: "a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4"


# --- Artifacts to be Deployed ---
# This section tells the Test Host WHAT to deploy.
# The files are fetched from a central artifact repository.
artifacts:
  repository_url: "https://artifactory.mycompany.com/artifactory/bsp-builds/"
  components:
    # First Stage Boot Loader and U-Boot, packaged by Xilinx tools.
    - name: "boot_binary"
      file: "BOOT.BIN"
      version: "1.0.0-137" # Corresponds to build_id
      checksum_md5: "e4d909c290d0fb1ca068ffaddf22cbd0"

    # The U-Boot compatible Linux Kernel image.
    - name: "kernel_image"
      file: "image.ub"
      version: "1.0.0-137"
      checksum_md5: "c4ca4238a0b923820dcc509a6f75849b"

    # The Device Tree Blob describing the hardware to the kernel.
    - name: "device_tree"
      file: "system.dtb"
      version: "1.0.0-137"
      checksum_md5: "d41d8cd98f00b204e9800998ecf8427e"

    # The compressed root filesystem containing the Linux user space.
    - name: "root_filesystem"
      file: "rootfs.tar.gz"
      version: "1.0.0-137"
      checksum_md5: "a87ff679a2f3e71d9181a67b7542122c"


# --- Deployment Configuration ---
# This section tells the Test Host HOW to provision the DUT.
deployment_config:
  # Method can be 'sd_card', 'jtag', or 'tftp'
  method: "sd_card"
  # Device path for the SD card writer on the Test Host
  sd_card_device: "/dev/sdb"


# --- Runtime Configuration ---
# This section defines how the DUT should be configured after it boots.
runtime_config:
  console:
    # As specified in the original request
    baud_rate: 115200

  network:
    interface: "eth0"
    # Method can be 'dhcp' or 'static'
    config_method: "static"
    # These values are used only if config_method is 'static'
    ip_address: "192.168.1.101"
    netmask: "255.255.255.0"
    gateway: "192.168.1.1"

  credentials:
    # Credentials for the test framework to log into the DUT
    # In a real system, this should be handled by Jenkins secrets, not plaintext.
    username: "root"
    password: "your_secure_password"


# --- Test Plan ---
# This section tells the test framework WHICH tests to execute for this run.
# This allows for different test suites (e.g., quick smoke vs. full nightly).
test_plan:
  - "boot_validation"   # Always run this first
  - "uart_tests"
  - "ethernet_connectivity"
  - "ethernet_performance"
  # - "ethernet_stress" # Example of a test that could be disabled for quick runs