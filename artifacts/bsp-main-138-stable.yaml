# ===================================================================
# Deployment Manifest for ZCU102 BSP Validation (Stable Release)
# ===================================================================
# This file is the single source of truth for a specific test run.
# It is generated by the CI/CD pipeline and consumed by the Test Host.
# -------------------------------------------------------------------

manifest_version: 1.0

# --- Target and Build Information (for Traceability) ---
target_board: "ZCU102"
build_info:
  build_id: "bsp-main-138-stable"
  commit_hash: "b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5"
  release_tag: "v2.1.0"
  build_timestamp: "2025-11-12T10:00:00Z"

# --- Artifacts to be Deployed ---
artifacts:
  repository_url: "https://artifactory.mycompany.com/artifactory/bsp-builds/"
  components:
    - name: "boot_binary"
      file: "BOOT.BIN"
      version: "2.1.0-138"
      checksum_md5: "f4d909c290d0fb1ca068ffaddf22cbd1"

    - name: "kernel_image"
      file: "image.ub"
      version: "2.1.0-138"
      checksum_md5: "d5ca4238a0b923820dcc509a6f75849c"

    - name: "device_tree"
      file: "system.dtb"
      version: "2.1.0-138"
      checksum_md5: "e41d8cd98f00b204e9800998ecf8427f"

    - name: "root_filesystem"
      file: "rootfs.tar.gz"
      version: "2.1.0-138"
      checksum_md5: "b87ff679a2f3e71d9181a67b7542122d"

# --- Deployment Configuration ---
deployment_config:
  method: "sd_card"
  sd_card_device: "/dev/sdb"
  verify_checksums: true
  backup_existing: true

# --- Runtime Configuration ---
runtime_config:
  console:
    baud_rate: 115200
    timeout_seconds: 300

  network:
    interface: "eth0"
    config_method: "dhcp"
    fallback_to_static: true
    static_config:
      ip_address: "192.168.1.101"
      netmask: "255.255.255.0"
      gateway: "192.168.1.1"

  system:
    timezone: "UTC"
    ntp_servers: ["pool.ntp.org"]
    enable_ssh: true
    enable_serial_console: true

  credentials:
    username: "root"
    password: "${SECURE_PASSWORD}"  # To be replaced by CI/CD pipeline

# --- Test Plan ---
test_plan:
  - "boot_validation"
  - "hardware_self_test"
  - "filesystem_integrity"
  - "kernel_modules_validation"
  - "network_connectivity"
  - "network_performance"
  - "storage_performance"
  - "stress_testing"
  - "security_scan"
  - "regression_suite"
  - "documentation_validation"

# --- Release Notes ---
release_notes: |
  ZCU102 BSP v2.1.0 Stable Release
  ===============================
  - Updated Linux kernel to 6.1.45
  - Security patches for OpenSSL and systemd
  - Improved Ethernet driver stability
  - Added support for new hardware revisions
  - Performance optimizations for storage I/O

  Test Coverage: 98.7%
  Known Issues: None
  Target Environments: Production
